{% extends "base.html" %}
{% block title %}Log in - Grub Roulette{% endblock %}
{% block content %}
<div class="auth-card">
    <h1>Log in</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    {% if unverified_email %}
    <form method="post" action="/resend-verification">
        <input type="hidden" name="email" value="{{ unverified_email }}">
        <button type="submit" class="secondary">Resend verification email</button>
    </form>
    {% endif %}
    <form method="post" action="/login">
        <label>Email or name<input type="text" name="identifier" required autofocus></label>
        <label>Password<input type="password" name="password" required></label>
        <button type="submit">Log in</button>
    </form>
    <p>No account yet? <a href="/register">Register</a></p>
</div>
{% endblock %}
