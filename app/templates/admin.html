{% extends "base.html" %}
{% block title %}Admin - Grub Roulette{% endblock %}
{% block content %}
<section class="panel">
    <h2>Usage stats</h2>
    <div id="stats-grid" class="stats-grid">Loading...</div>
</section>

<section class="panel">
    <h2>Users</h2>
    <table class="admin-table" id="users-table">
        <thead>
            <tr>
                <th class="sortable" data-sort="display_name">Name<span class="sort-indicator"></span></th>
                <th class="sortable" data-sort="email">Email<span class="sort-indicator"></span></th>
                <th class="sortable" data-sort="group">Group<span class="sort-indicator"></span></th>
                <th class="sortable" data-sort="is_admin">Admin<span class="sort-indicator"></span></th>
                <th class="sortable" data-sort="created_at">Joined<span class="sort-indicator"></span></th>
                <th></th>
            </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
    </table>
</section>

<section class="panel">
    <h2>Groups</h2>
    <div id="groups-list" class="companions-list"></div>
    <label>New group name
        <input type="text" id="new-group-name" placeholder="e.g. Gothenburg">
    </label>
    <button id="add-group" class="secondary">Add group</button>
</section>

<script src="/static/js/admin.js?v={{ static_version }}"></script>
{% endblock %}
