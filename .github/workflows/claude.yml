# Lets @claude mentions in issue/PR comments, reviews, or newly opened issues
# automatically trigger a Claude Code run against this repo.
#
# One-time setup required before this does anything:
#   1. Install the Claude GitHub App on this repo: https://github.com/apps/claude
#   2. Add an ANTHROPIC_API_KEY secret (Settings -> Secrets and variables ->
#      Actions -> New repository secret) with a key from
#      https://console.anthropic.com/settings/keys
#
# This repo is public, so anyone can comment "@claude" on an issue/PR --
# without the actor check below, that would run Claude with write access to
# this repo and billed API usage, triggered by anyone at all. Only
# magnushacker is allowed to trigger it; update ALLOWED_ACTOR if that changes.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude-code-action:
    if: |
      github.actor == 'magnushacker' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"
